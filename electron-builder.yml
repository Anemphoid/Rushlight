appId: cc.rushlight.app
productName: Rushlight
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!.github/**'
asarUnpack:
  - resources/**
  - node_modules/uiohook-napi/**
# uiohook-napi ships prebuilt N-API binaries that work with Electron as-is.
# Rebuilding from source would need X11 development headers on the build
# machine for no benefit.
npmRebuild: false
linux:
  target:
    - AppImage
  maintainer: rushlight.cc
  category: Network
  synopsis: Privacy-focused voice chat
# No version in the filename on purpose: electron-updater's AppImage updater
# only overwrites a running AppImage in place when its filename has no
# version number in it. A versioned name (Rushlight-0.1.0.AppImage) makes it
# delete the old file and write a differently-named new one instead, which
# breaks any fixed-path desktop launcher on the very first auto-update.
appImage:
  artifactName: ${productName}.${ext}
# Windows: an installer that puts the program in the person's own folder, so it asks for no administrator rights. The same
# name every time, so a download link (and the website's button) never changes, like the AppImage. Built only on a
# Windows machine (GitHub's), where the release workflow's `windows` job publishes it with `latest.yml` for updates.
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup.${ext}
# No publish block on purpose: a local `npm run dist` just builds the AppImage.
# The release workflow adds the GitHub update feed on the command line, where
# the repo is known from the git remote.
